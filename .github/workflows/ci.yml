name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobapplier
          POSTGRES_PASSWORD: jobapplier
          POSTGRES_DB: jobapplier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobapplier -d jobapplier_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql://jobapplier:jobapplier@localhost:5432/jobapplier_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/*/pyproject.toml
            services/*/pyproject.toml
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy packages/common/src services/api/src
      - name: Test
        run: pytest

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f services/api/Dockerfile -t jobapplier-api:ci .
