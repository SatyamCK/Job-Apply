[project]
name = "jobapplier-common"
version = "0.1.0"
description = "Shared config, logging, tracing, events, metrics, queues and DB models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "SQLAlchemy>=2.0.35",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
common = ["py.typed"]
