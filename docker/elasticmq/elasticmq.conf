# Local SQS queues. Names and maxReceiveCount must match `queues` in config/local.yaml
# (checked by packages/common/tests/test_local_stack.py).
include classpath("application.conf")

node-address { protocol = http, host = elasticmq, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }

queues {
  jobapplier-local-fetch { deadLettersQueue { name = "jobapplier-local-fetch-dlq", maxReceiveCount = 5 } }
  jobapplier-local-fetch-dlq {}
  jobapplier-local-normalize { deadLettersQueue { name = "jobapplier-local-normalize-dlq", maxReceiveCount = 5 } }
  jobapplier-local-normalize-dlq {}
  jobapplier-local-match { deadLettersQueue { name = "jobapplier-local-match-dlq", maxReceiveCount = 5 } }
  jobapplier-local-match-dlq {}
  jobapplier-local-contact { deadLettersQueue { name = "jobapplier-local-contact-dlq", maxReceiveCount = 5 } }
  jobapplier-local-contact-dlq {}
  jobapplier-local-draft { deadLettersQueue { name = "jobapplier-local-draft-dlq", maxReceiveCount = 5 } }
  jobapplier-local-draft-dlq {}
  jobapplier-local-send { deadLettersQueue { name = "jobapplier-local-send-dlq", maxReceiveCount = 5 } }
  jobapplier-local-send-dlq {}
}
